name: Update Game Data
on:
  schedule:
    - cron: '*/20 * * * *'  # 每20分钟运行一次
  workflow_dispatch:

# 并发控制
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # # 修改：增加超时到45分钟
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean old database
        run: |
          if [ ! -f data/app_list.db ]; then
            rm -f data/app_list.db
            echo "已清理旧数据库"
          else
            echo "数据库已存在，跳过清理"
          fi

      - name: Check invalid_appids.json size
        run: |
          if [ -f data/invalid_appids.json ]; then
            size=$(du -m data/invalid_appids.json | cut -f1)
            if [ $size -gt 90 ]; then
              echo "::warning::invalid_appids.json size is ${size}MB, approaching GitHub limit"
            fi
          fi

      # # 修改：添加清理旧无效AppIDs步骤
      - name: Clean old invalid AppIDs
        run: |
          if [ -f data/invalid_appids.json ]; then
            python -c "
            import json
            from datetime import datetime, timedelta
            with open('data/invalid_appids.json', 'r') as f:
                data = json.load(f)
            cutoff = (datetime.now() - timedelta(days=30)).isoformat()
            data['invalid_appids'] = [e for e in data.get('invalid_appids', []) if e['timestamp'] >= cutoff]
            with open('data/invalid_appids.json', 'w') as f:
                json.dump(data, f, indent=2)
            print(f'Cleaned to {len(data[\"invalid_appids\"])} entries')
            "
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch App List
        run: |
          echo "::group::📥 正在同步应用列表"
          python Src/fetch_app_list.py
          echo "::endgroup::"

      - name: Get App Details
        run: |
          echo "::group::🔍 获取应用详情"
          python Src/get_app_details.py
          echo "当前 output.json 文件大小: $(du -h data/output.json | cut -f1)"
          echo "::endgroup::"

      - name: Run scraper
        id: scraper
        # # 修改：添加DEBUG_MODE=true
        env:
          DEBUG_MODE: true
        run: python Src/scraper.py

      # # 修改：添加调试失败AppIDs步骤
      - name: Debug failed AppIDs
        if: always()
        run: |
          echo "::group::🔍 检查失败 AppID"
          if [ -f data/failed_appids.json ]; then
            cat data/failed_appids.json | jq '.invalid_appids | length' || echo "No JSON"
          else
            echo "No failed_appids.json"
          fi
          echo "::endgroup::"

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'data/*.json data/*.db'  # 自动包含 invalid_appids.json
          message: |
            🎮 游戏数据更新 [${{ github.run_number }}]
            统计结果：
            ✅ 中文游戏: ${{ steps.scraper.outputs.new_chinese }}
            🃏 卡牌游戏: ${{ steps.scraper.outputs.new_cards }}
          push: true
