name: Update Game Data
on:
  schedule:
    - cron: '*/60 * * * *'  # 每60分钟运行一次（原为每2分钟：'*/2 * * * *'）
  workflow_dispatch:

# 并发控制
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6  # 升级到 v6（最新 v6.0.2，支持 Node 24）
        with:
          fetch-depth: 1

      - name: Clean old database
        run: |
          if [ ! -f data/app_list.db ]; then
            rm -f data/app_list.db
            echo "已清理旧数据库"
          else
            echo "数据库已存在，跳过清理"
          fi

      - name: Check invalid_appids.json size
        run: |
          if [ -f data/invalid_appids.json ]; then
            size=$(du -m data/invalid_appids.json | cut -f1)
            if [ $size -gt 90 ]; then
              echo "::warning::invalid_appids.json size is ${size}MB, approaching GitHub limit"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v6  # 升级到 v6.2.0（最新，支持 Node 24）
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch App List
        run: |
          echo "::group::📥 正在同步应用列表"
          python Src/fetch_app_list.py
          echo "::endgroup::"

      - name: Get App Details
        run: |
          echo "::group::🔍 获取应用详情"
          python Src/get_app_details.py
          echo "当前 output.json 文件大小: $(du -h data/output.json | cut -f1)"
          echo "::endgroup::"

      - name: Run scraper
        id: scraper
        run: python Src/scraper.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7  # 替换为活跃维护的 action（v7.1.0 支持 Node 24）
        with:
          commit_message: |
            🎮 游戏数据更新 [${{ github.run_number }}]
            统计结果：
            ✅ 中文游戏: ${{ steps.scraper.outputs.new_chinese }}
            🃏 卡牌游戏: ${{ steps.scraper.outputs.new_cards }}
          file_pattern: 'data/*.json data/*.db'  # 对应原 add: 'data/*.json data/*.db'
          skip_dirty_check: false                # 如果无变更则不 commit（默认行为）
          push_options: '--force-with-lease'     # 安全 push，避免意外覆盖
