name: Update Game Data
on:
  schedule:
    - cron: '*/20 * * * *'  # 每20分钟运行一次
  workflow_dispatch:

# 并发控制（加 run_id 唯一化，生产回 cancel-in-progress: true 防撞）
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false  # 临时 false，生产 true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull remote changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git stash push -m "Temp stash for pull"  # 保存 unstaged
          git pull --rebase origin main  # 拉远程
          git stash pop || true  # 恢复 stash，失败忽略

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs track "data/*.json" "data/*.db"
          git add .gitattributes

      - name: Clean old database
        run: |
          if [ ! -f data/app_list.db ]; then
            rm -f data/app_list.db
            echo "已清理旧数据库"
          else
            echo "数据库已存在，跳过清理"
          fi

      - name: Check invalid_appids.json size
        run: |
          if [ -f data/invalid_appids.json ]; then
            size=$(du -m data/invalid_appids.json | cut -f1)
            if [ $size -gt 90 ]; then
              echo "::warning::invalid_appids.json size is ${size}MB, approaching GitHub limit"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch App List
        run: |
          echo "::group::📥 正在同步应用列表"
          python Src/fetch_app_list.py
          echo "::endgroup::"

      - name: Get App Details
        run: |
          echo "::group::🔍 获取应用详情"
          python Src/get_app_details.py
          echo "当前 output.json 文件大小: $(du -h data/output.json | cut -f1)"
          echo "::endgroup::"

      - name: Run scraper
        id: scraper
        env:
          DEBUG_MODE: true
        run: python Src/scraper.py

      - name: Debug failed AppIDs
        if: always()
        run: |
          echo "::group::🔍 检查失败 AppID"
          if [ -f data/failed_appids.json ]; then
            cat data/failed_appids.json | jq -r '.invalid_appids | length // empty' || echo "0"
          else
            echo "No failed_appids.json"
          fi
          echo "::endgroup::"

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'data/chinese_games.json data/card_games.json data/app_list.db data/invalid_appids.json data/failed_appids.json'
          message: |
            🎮 游戏数据更新 [${{ github.run_number }}]
            统计结果：
            ✅ 中文游戏: ${{ steps.scraper.outputs.new_chinese }}
            🃏 卡牌游戏: ${{ steps.scraper.outputs.new_cards }}
          push: true
